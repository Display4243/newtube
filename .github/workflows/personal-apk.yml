name: Personal APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test title filtering
        run: ./gradlew --no-daemon :smarttubetv:testStmobileDebugUnitTest --tests com.newtube.mobile.ui.common.BlockedTitleFilterTest
      - name: Build debug APKs
        run: ./gradlew --no-daemon :smarttubetv:assembleStmobileDebug
      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube-personal-${{ github.run_number }}
          path: smarttubetv/build/outputs/apk/stmobile/debug/*.apk
          if-no-files-found: error
          retention-days: 14
